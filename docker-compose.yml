version: "3.9"
services:
  db:
    image: postgres:16.3
    container_name: postgres_db
    environment:
      POSTGRES_DB: social
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: social_api
    ports:
      - "4000:4000"          # Host:Container
    environment:
      ADDR: ":4000"
      DB_ADDR: "postgres://admin:adminpassword@db/social?sslmode=disable"
    depends_on:
      - db

volumes:
  db_data:
